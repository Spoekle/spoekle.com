name: spoekle.com

services:
  mongo:
    image: mongo:latest
    container_name: spoekle-mongo
    volumes:
        - mongo-data:/data/db
        - type: bind
          source: ./mongo
          target: /dump
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: spoekle-api
    ports:
      - "5000:80"
    volumes:
      - type: bind
        source: ./backend/src/uploads
        target: /var/www/backend/src/uploads
      - type: bind
        source: ./backend/src/profilePictures
        target: /var/www/backend/src/profilePictures
      - type: bind
        source: ./backend/src/download
        target: /var/www/backend/src/download
      - type: bind
        source: ./backend/src/scripts
        target: /var/www/backend/src/scripts
      - type: bind
        source: ./backend/src/download/tmp
        target: /var/www/backend/src/download/tmp
    depends_on:
      - mongo
    environment:
      - VIRTUAL_HOST=spoekle.com
      - MONGO_URI=mongodb://mongo:27017/spoekleDB
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: spoekle-frontend
    ports:
      - "8081:80"
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=spoekle.com
    restart: unless-stopped

  cdn:
    image: nginx:alpine
    container_name: spoekle-cdn
    ports:
      - "8082:80"
    volumes:
      - type: bind
        source: ./backend/cdn-nginx.conf
        target: /etc/nginx/conf.d/default.conf
    environment:
      - VIRTUAL_HOST=cdn.spoekle.com
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
